name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ProtonInboxWidget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProtonInboxWidget-apk
          path: ProtonInboxWidget.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          body: Debug-signed APK built from the latest commit. Download and sideload on your phone.
          files: ProtonInboxWidget.apk
